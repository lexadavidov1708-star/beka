<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beka · Битрикс дашборд</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #1c2230; --muted: #6b7489; --border: #e3e7ef;
    --accent: #2f6fed; --good: #1f9d55; --bad: #d64545; --warn: #d98a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141b; --card: #1a1f2a; --text: #e6e9f0; --muted: #8f98ab; --border: #2a3140;
      --accent: #5b8ff9; --good: #3cc47c; --bad: #f06a6a; --warn: #f2b134;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
           padding: 16px; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button, input { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border);
                  border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; }
  button.active, button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 1400px; margin: 0 auto; padding: 0 16px 40px; }
  .grid { display: grid; gap: 12px; margin-bottom: 12px; }
  .kpis { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .two { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; min-width: 0; }
  .kpi .v { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .kpi .s { font-size: 12px; color: var(--muted); }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .chart { position: relative; height: 260px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; cursor: pointer; user-select: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); text-decoration: none; }
  .bar { height: 6px; background: var(--accent); border-radius: 3px; opacity: .8; }
  .stage-row { display: grid; grid-template-columns: minmax(120px, 1.2fr) 2fr 60px 110px; gap: 8px;
               align-items: center; padding: 4px 0; font-size: 13px; }
  .stage-row span:nth-child(n+3) { text-align: right; font-variant-numeric: tabular-nums; }
  #status { padding: 40px; text-align: center; }
  .error { color: var(--bad); white-space: pre-wrap; }
  .section-title { margin: 22px 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1>📊 Beka · Битрикс24</h1>
    <div class="muted" id="meta">&nbsp;</div>
  </div>
  <div class="controls">
    <button data-preset="today">Сегодня</button>
    <button data-preset="week">7 дней</button>
    <button data-preset="month" class="active">Этот месяц</button>
    <button data-preset="prev">Прошлый месяц</button>
    <button data-preset="quarter">Квартал</button>
    <input type="date" id="from"> — <input type="date" id="to">
    <button class="primary" id="apply">Показать</button>
    <button id="refresh" title="Загрузить заново из Битрикса">⟳</button>
  </div>
</header>
<main>
  <div id="status">Загружаю данные из Битрикса…</div>
  <div id="content" hidden>
    <div class="section-title">Продажи</div>
    <div class="grid kpis" id="kpi-sales"></div>
    <div class="grid two">
      <div class="card"><h2>Выручка по дням (выигранные сделки)</h2><div class="chart"><canvas id="c-revenue"></canvas></div></div>
      <div class="card"><h2>Новые сделки и лиды по дням</h2><div class="chart"><canvas id="c-flow"></canvas></div></div>
    </div>
    <div class="grid two">
      <div class="card"><h2>Воронка: открытые сделки сейчас</h2><div id="funnels"></div></div>
      <div class="card scroll"><h2>Топ-10 выигранных сделок</h2><table id="t-top"></table></div>
    </div>

    <div class="section-title">Лиды</div>
    <div class="grid kpis" id="kpi-leads"></div>
    <div class="grid two">
      <div class="card"><h2>Источники лидов</h2><div class="chart"><canvas id="c-sources"></canvas></div></div>
      <div class="card"><h2>Статусы лидов</h2><div class="chart"><canvas id="c-lstatus"></canvas></div></div>
    </div>

    <div class="section-title">Менеджеры</div>
    <div class="card scroll"><table id="t-managers"></table></div>

    <div class="section-title">Задачи</div>
    <div class="grid kpis" id="kpi-tasks"></div>
    <div class="card scroll"><h2>Просроченные задачи</h2><table id="t-overdue"></table></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("ru-RU", {maximumFractionDigits: 0});
let data = null, charts = {}, mgrSort = {key: "won_sum", dir: -1};

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const PALETTE = ["#2f6fed", "#1f9d55", "#d98a00", "#d64545", "#8e59d9", "#1aa3b8", "#c2569b", "#6b7489", "#7fae2b", "#e0703c"];

function iso(d) { return d.toISOString().slice(0, 10); }
function setPreset(p) {
  const t = new Date(); t.setMinutes(t.getMinutes() - t.getTimezoneOffset());
  let f = new Date(t), to = new Date(t);
  if (p === "week") f.setDate(t.getDate() - 6);
  if (p === "month") f.setDate(1);
  if (p === "prev") { f = new Date(t.getFullYear(), t.getMonth() - 1, 1, 12); to = new Date(t.getFullYear(), t.getMonth(), 0, 12); }
  if (p === "quarter") f = new Date(t.getFullYear(), Math.floor(t.getMonth() / 3) * 3, 1, 12);
  $("#from").value = iso(f); $("#to").value = iso(to);
  document.querySelectorAll("[data-preset]").forEach(b => b.classList.toggle("active", b.dataset.preset === p));
}

async function load(refresh) {
  $("#status").hidden = false; $("#status").className = ""; $("#status").textContent = "Загружаю данные из Битрикса…";
  try {
    const q = new URLSearchParams({from: $("#from").value, to: $("#to").value});
    if (refresh) q.set("refresh", "1");
    const r = await fetch("api/summary?" + q);
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || r.statusText);
    data = j; render();
    $("#status").hidden = true; $("#content").hidden = false;
  } catch (e) {
    $("#status").className = "error"; $("#status").textContent = "Не удалось загрузить: " + e.message;
    $("#content").hidden = true;
  }
}

const money = v => nf.format(v) + (data.currency ? " " + data.currency : "");
function kpi(label, value, sub, cls) {
  return `<div class="card kpi"><div class="muted">${esc(label)}</div><div class="v ${cls || ""}">${value}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
}

function chart(id, cfg) {
  if (typeof Chart === "undefined") {
    $(id).parentElement.innerHTML = `<div class="muted">Графики не загрузились (нет доступа к cdnjs.cloudflare.com)</div>`;
    return;
  }
  if (charts[id]) charts[id].destroy();
  Chart.defaults.color = css("--muted");
  Chart.defaults.borderColor = css("--border");
  charts[id] = new Chart($(id), {...cfg, options: {responsive: true, maintainAspectRatio: false, ...(cfg.options || {})}});
}

function render() {
  const k = data.kpi;
  $("#meta").textContent = `${data.period.from} — ${data.period.to} · обновлено ${data.generated_at}`;

  $("#kpi-sales").innerHTML =
    kpi("Выручка", money(k.won_sum), `${k.won} выиграно`, "good") +
    kpi("Новые сделки", nf.format(k.deals_new)) +
    kpi("Конверсия", k.conversion == null ? "—" : k.conversion + "%", `${k.won} выиграно / ${k.lost} проиграно`) +
    kpi("Средний чек", money(k.avg_check)) +
    kpi("В работе сейчас", money(k.pipeline_sum), `${k.pipeline_count} открытых сделок`) +
    kpi("Звонки", nf.format(k.calls));

  $("#kpi-leads").innerHTML =
    kpi("Новые лиды", nf.format(k.leads)) +
    kpi("Сконвертировано", nf.format(k.leads_converted), k.leads ? Math.round(100 * k.leads_converted / k.leads) + "% от лидов" : "", "good") +
    kpi("Некачественные", nf.format(k.leads_junk), "", "bad");

  $("#kpi-tasks").innerHTML =
    kpi("Открытые задачи", nf.format(k.tasks_open)) +
    kpi("Просрочено", nf.format(k.tasks_overdue), "", k.tasks_overdue ? "bad" : "") +
    kpi("Выполнено за период", nf.format(k.tasks_done), "", "good");

  const labels = data.timeline.days.map(d => d.slice(8, 10) + "." + d.slice(5, 7));
  chart("#c-revenue", {type: "bar", data: {labels, datasets: [{label: "Выручка", data: data.timeline.revenue, backgroundColor: css("--good")}]},
    options: {plugins: {legend: {display: false}}}});
  chart("#c-flow", {type: "line", data: {labels, datasets: [
    {label: "Сделки", data: data.timeline.deals_created, borderColor: css("--accent"), backgroundColor: css("--accent"), tension: .3},
    {label: "Лиды", data: data.timeline.leads, borderColor: css("--warn"), backgroundColor: css("--warn"), tension: .3}]}});

  const pie = (id, rows) => chart(id, {type: "doughnut",
    data: {labels: rows.map(r => r[0]), datasets: [{data: rows.map(r => r[1]), backgroundColor: PALETTE, borderColor: css("--card")}]},
    options: {plugins: {legend: {position: "right"}}}});
  pie("#c-sources", data.leads_by_source);
  pie("#c-lstatus", data.leads_by_status);

  $("#funnels").innerHTML = data.funnels.length ? data.funnels.map(f => {
    const max = Math.max(...f.stages.map(s => s.count), 1);
    return `<div class="muted" style="margin:8px 0 4px">${esc(f.name)}</div>` + f.stages.map(s =>
      `<div class="stage-row"><span>${esc(s.stage)}</span><div class="bar" style="width:${Math.max(2, 100 * s.count / max)}%"></div><span>${s.count}</span><span>${nf.format(s.sum)}</span></div>`).join("");
  }).join("") : `<div class="muted">Нет открытых сделок</div>`;

  $("#t-top").innerHTML = `<tr><th>Сделка</th><th>Менеджер</th><th>Дата</th><th class="num">Сумма</th></tr>` +
    (data.top_won.map(d => `<tr><td><a target="_blank" href="${esc(data.portal)}/crm/deal/details/${esc(d.id)}/">${esc(d.title)}</a></td>
      <td>${esc(d.manager)}</td><td>${esc(d.date)}</td><td class="num">${nf.format(d.sum)}</td></tr>`).join("")
     || `<tr><td colspan="4" class="muted">Нет выигранных сделок за период</td></tr>`);

  renderManagers();

  $("#t-overdue").innerHTML = `<tr><th>Задача</th><th>Ответственный</th><th>Дедлайн</th></tr>` +
    (data.overdue_tasks.map(t => `<tr><td><a target="_blank" href="${esc(data.portal)}/company/personal/user/0/tasks/task/view/${esc(t.id)}/">${esc(t.title)}</a></td>
      <td>${esc(t.responsible)}</td><td class="bad">${esc(t.deadline)}</td></tr>`).join("")
     || `<tr><td colspan="3" class="muted">Просроченных задач нет 👍</td></tr>`);
}

const MGR_COLS = [
  ["name", "Менеджер"], ["won_sum", "Выручка"], ["won", "Выиграно"], ["lost", "Проиграно"], ["conversion", "Конв., %"],
  ["deals_new", "Новые сделки"], ["pipeline_sum", "В работе"], ["leads", "Лиды"], ["calls", "Звонки"],
  ["tasks_open", "Задачи"], ["tasks_overdue", "Просрочено"], ["tasks_done", "Выполнено"],
];
function renderManagers() {
  const rows = [...data.managers].sort((a, b) => {
    const x = a[mgrSort.key] ?? -1, y = b[mgrSort.key] ?? -1;
    return (x > y ? 1 : x < y ? -1 : 0) * mgrSort.dir;
  });
  $("#t-managers").innerHTML = "<tr>" + MGR_COLS.map(([k, l]) =>
      `<th data-k="${k}" class="${k === "name" ? "" : "num"}">${l}${mgrSort.key === k ? (mgrSort.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("") + "</tr>" +
    (rows.map(m => "<tr>" + MGR_COLS.map(([k]) => {
      let v = m[k];
      if (k === "name") return `<td>${esc(v)}</td>`;
      if (k === "conversion") v = v == null ? "—" : v;
      else v = nf.format(v);
      const cls = k === "tasks_overdue" && m[k] ? "num bad" : "num";
      return `<td class="${cls}">${v}</td>`;
    }).join("") + "</tr>").join("") || `<tr><td class="muted">Нет данных</td></tr>`);
  document.querySelectorAll("#t-managers th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    mgrSort = {key: k, dir: mgrSort.key === k ? -mgrSort.dir : (k === "name" ? 1 : -1)};
    renderManagers();
  });
}

document.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => { setPreset(b.dataset.preset); load(); });
$("#apply").onclick = () => { document.querySelectorAll("[data-preset]").forEach(b => b.classList.remove("active")); load(); };
$("#refresh").onclick = () => load(true);
setPreset("month");
load();
</script>
</body>
</html>
